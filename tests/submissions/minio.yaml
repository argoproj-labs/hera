# S3 artifact repository for the on-cluster tests. The workflow controller
# configmap from argoproj-labs/training-material expects the `minio` service,
# the `workflows` bucket and the `my-minio-cred` secret defined here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  labels:
    app: minio
spec:
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      automountServiceAccountToken: false
      containers:
        - name: main
          # Silo is a maintained fork of the MinIO server (MinIO stopped publishing
          # community images); it keeps the S3 API, MINIO_* settings and data format.
          image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
          env:
            - name: MINIO_ROOT_USER
              value: argoproj
            - name: MINIO_ROOT_PASSWORD
              value: sup3rs3cr3tp4ssw0rd1
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: dashboard
          command: [silo, server, --console-address, ":9001", /data]
          lifecycle:
            postStart:
              exec:
                command: [mkdir, -p, /data/workflows]
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
    app: minio
spec:
  selector:
    app: minio
  ports:
    - port: 9000
      name: api
      protocol: TCP
      targetPort: 9000
    - port: 9001
      name: dashboard
      protocol: TCP
      targetPort: 9001
---
apiVersion: v1
kind: Secret
metadata:
  name: my-minio-cred
  labels:
    app: minio
type: Opaque
stringData:
  accesskey: argoproj
  secretkey: sup3rs3cr3tp4ssw0rd1
