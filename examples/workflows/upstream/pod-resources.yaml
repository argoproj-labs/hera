apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: pod-resources-
spec:
  entrypoint: hello-world
  templates:
  - name: hello-world
    container:
      image: busybox
      args:
      - hello world
      command:
      - echo
  podResources:
    limits:
      cpu: '1'
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 64Mi
