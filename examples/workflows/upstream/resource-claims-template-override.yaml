apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: resource-claims-template-override-
  labels:
    workflows.argoproj.io/no-test: environment
spec:
  entrypoint: main
  resourceClaims:
  - name: accelerator
    resourceClaimTemplateName: example-device-claim-template
  templates:
  - name: default-device
    container:
      image: busybox
      args:
      - using the workflow default device
      command:
      - echo
      resources:
        claims:
        - name: accelerator
  - name: other-device
    resourceClaims:
    - name: accelerator
      resourceClaimTemplateName: example-large-device-claim-template
    container:
      image: busybox
      args:
      - using a different device
      command:
      - echo
      resources:
        claims:
        - name: accelerator
  - name: main
    steps:
    - - name: default-device
        template: default-device
    - - name: other-device
        template: other-device
